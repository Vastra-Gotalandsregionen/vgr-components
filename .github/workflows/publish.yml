name: Publish packages

on:
  # Tagg release-x.y.z publicerar alla fyra paketen med version x.y.z
  push:
    tags: ['release-*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to use in the dry run (x.y.z)'
        type: string
        default: '0.0.0'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@vastra-gotalandsregionen'

      - name: Install
        run: npm ci

      - name: Set versions
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#release-}"
          else
            VERSION="$INPUT_VERSION"
          fi
          node scripts/set-version.mjs "$VERSION"

      - name: Build
        run: |
          npm run build --workspace=@vastra-gotalandsregionen/design-tokens
          npm run build --workspace=@vastra-gotalandsregionen/components-core
          npm run build --workspace=@vastra-gotalandsregionen/components-react
          npm run build --workspace=@vastra-gotalandsregionen/components-angular
          npm run build --workspace=@vastra-gotalandsregionen/components-vue

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAG=""
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            FLAG="--dry-run --tag dry-run"
          fi
          for p in core react angular vue; do
            npm publish --workspace=@vastra-gotalandsregionen/components-$p $FLAG
          done